spring:
  application:
    name: store-front
  jpa:
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jwt:
    secretKey: ${JWT_SECRET}
    accessTokenExpiration: 7200 #2hr
    refreshTokenExpiration: 604800  #7days
  profiles:
    active: true
stripe:
  secret: ${STRIPE_SECRET_KEY}
  webHookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY}

